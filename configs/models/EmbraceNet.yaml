# EmbraceNet (Choi & Lee, Inf. Fusion 2019) — feature-level: per-sensor docking layer + ReLU,
# then the embracement (each feature component drawn from one available sensor, uniformly)
# and a shared MLP head. The embracement is stochastic at test time too.
# Exactly the recipe of the paper's runs (only paths removed).
task_type: classification
training:
  max_epochs: 100
  batch_size: 128
  emb_dim: 128
  early_stop_args: {min_delta: 0.01, mode: min, patience: 5, verbose: true}
  missing_as_aug: true                       # sensor dropout during training
  missing_method: {name: ignore, random_perc: 0.5}
  additional_args: {optimizer: adam, lr: 0.001}
  loss_args: {name: ce}                      # class-balanced weights are added per fold
preprocess: {fillnan: false, flatten: false, form: zscore}
architecture:
  encoders:
    S2_S2VI: {model_type: tempcnn, dropout: 0.2, kernel_size: 5, layer_size: 128, n_layers: 2, seq_len: 12, use_norm: true}
    S1:      {model_type: tempcnn, dropout: 0.2, kernel_size: 5, layer_size: 128, n_layers: 2, seq_len: 12, use_norm: true}
    weather: {model_type: tempcnn, dropout: 0.2, kernel_size: 5, layer_size: 128, n_layers: 2, seq_len: 12, use_norm: true}
    DEM:     {model_type: mlp, n_layers: 1, layer_size: 128, dropout: 0.2, batchnorm: false, use_norm: true}
  predictive_model: {n_layers: 1, layer_size: 128, dropout: 0.2, batchnorm: true}
method:
  feature: true                              # feature level
  agg_args: {mode: embracenet, adaptive: false}
